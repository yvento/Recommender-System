<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Recommendation System</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
    }
    .container { max-width: 800px; margin-top: 50px; }
    .card { border-radius: 15px; box-shadow: 0 6px 20px rgba(0,0,0,0.2); }
    h1 { color: white; font-weight: 700; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }

    .recommendation-card {
        background: #fff; padding: 20px; margin-bottom: 15px;
        border-radius: 12px; border: none;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .recommendation-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }
    .product-icon {
        font-size: 32px; margin-right: 12px;
    }
    .badge-rec {
        background: linear-gradient(135deg, #ff9966, #ff5e62);
        color: white;
        border-radius: 20px;
        padding: 5px 12px;
        font-size: 12px;
        font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container text-center">
    <h1 class="mb-4">✨ Product Recommendation System ✨</h1>
    <form id="recommendationForm" class="card p-4">
      <div class="mb-3">
        <label for="user_id" class="form-label fw-bold">Choose a Customer ID:</label>
        <select id="sample_user_id" class="form-select mb-3">
          <option value="">-- Select a Customer ID --</option>
          <option value="103611">103611</option>
          <option value="103997">103997</option>
          <option value="103741">103741</option>
          <option value="103806">103806</option>
          <option value="103378">103378</option>
        </select>

        <label for="user_id" class="form-label fw-bold">Or Enter Customer ID Manually:</label>
        <input type="text" id="user_id" name="user_id" class="form-control">
      </div>
      <button type="submit" class="btn btn-dark w-100">Get Recommendations</button>
    </form>

    <div class="result mt-4" id="result"></div>
  </div>

  <script>
    $(document).ready(function() {
      $('#recommendationForm').on('submit', function(e) {
        e.preventDefault();

        var userId = $('#sample_user_id').val() || $('#user_id').val();

        if (!userId) {
          $('#result').html('<div class="alert alert-warning">⚠️ Please select or enter a Customer ID.</div>');
          return;
        }

        $('#result').html('<div class="spinner-border text-light" role="status"><span class="visually-hidden">Loading...</span></div>');

        $.ajax({
          url: '/recommend',
          type: 'POST',
          contentType: 'application/json',
          data: JSON.stringify({ "user_id": userId }),
          success: function(data) {
            if (data.length === 0) {
              $('#result').html('<div class="alert alert-warning">⚠️ No recommendations found for this ID.</div>');
              return;
            }
            var results = '<h3 class="text-white mb-3">🌟 Top Recommendations For You</h3>';
            $.each(data, function(index, value) {
              results += `
                <div class="recommendation-card d-flex align-items-center text-start">
                  <span class="product-icon">📦</span>
                  <div>
                    <h5 class="mb-1">Product ID: ${value[0]}</h5>
                    <p class="mb-1"><strong>Product Name:</strong> ${value[2]}</p>
                    <span class="badge-rec">Recommended for You</span>
                  </div>
                </div>`;
            });
            $('#result').html(results);
          },
          error: function() {
            $('#result').html('<div class="alert alert-danger">❌ An error occurred. Please try again.</div>');
          }
        });
      });
    });
  </script>
</body>
</html>
