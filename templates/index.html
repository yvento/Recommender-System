<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Recommendation System</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background-color: #f8f9fa; }
    .container { max-width: 700px; margin-top: 60px; }
    .card { border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .recommendation-card { 
        background: #fff; padding: 12px; margin-bottom: 10px; 
        border-radius: 8px; border: 1px solid #e0e0e0; 
        transition: 0.3s; 
    }
    .recommendation-card:hover { background: #f1f1f1; }
    .rating-badge { background: #007bff; color: white; padding: 5px 10px; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="container text-center">
    <h1 class="mb-4">📊 Product Recommendation System</h1>
    <form id="recommendationForm" class="card p-4">
      <div class="mb-3">
        <label for="user_id" class="form-label">Choose a Customer ID:</label>
        <select id="sample_user_id" class="form-select mb-3">
          <option value="">-- Select a Customer ID --</option>
          <option value="103611">103611</option>
          <option value="619">619</option>
          <option value="1024">1024</option>
          <option value="5000">5000</option>
          <option value="7501">7501</option>
        </select>

        <label for="user_id" class="form-label">Or Enter Customer ID Manually:</label>
        <input type="text" id="user_id" name="user_id" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary w-100">Get Recommendations</button>
    </form>

    <div class="result mt-4" id="result"></div>
  </div>

  <script>
    $(document).ready(function() {
      $('#recommendationForm').on('submit', function(e) {
        e.preventDefault();

        // Priority: dropdown > manual entry
        var userId = $('#sample_user_id').val() || $('#user_id').val();

        if (!userId) {
          $('#result').html('<div class="alert alert-warning">⚠️ Please select or enter a Customer ID.</div>');
          return;
        }

        // Show loading spinner
        $('#result').html('<div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>');

        $.ajax({
          url: '/recommend',
          type: 'POST',
          contentType: 'application/json',
          data: JSON.stringify({ "user_id": userId }),
          success: function(data) {
            if (data.length === 0) {
              $('#result').html('<div class="alert alert-warning">⚠️ No recommendations found for this ID.</div>');
              return;
            }
            var results = '<h3 class="mb-3">Top Recommendations</h3>';
            $.each(data, function(index, value) {
              results += `
                <div class="recommendation-card text-start">
                  <strong>Product ID:</strong> ${value[0]} 
                  <span class="rating-badge">⭐ ${value[1]}</span>
                </div>`;
            });
            $('#result').html(results);
          },
          error: function() {
            $('#result').html('<div class="alert alert-danger">❌ An error occurred. Please try again.</div>');
          }
        });
      });
    });
  </script>
</body>
</html>
